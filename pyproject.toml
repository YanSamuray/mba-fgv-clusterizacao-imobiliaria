[project]
name = "projetofinal"
version = "0.1.0"
description = "Segmentação do mercado imobiliário com o dataset California Housing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.2.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
